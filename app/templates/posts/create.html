{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h1>Create Post</h1>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Title</label>
            <input
                type="text"
                name="title"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Content</label>
            <textarea
                name="content"
                class="form-control"
                rows="8"
                required
            ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Publish
        </button>

        <a href="{{ url_for('posts.index') }}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
